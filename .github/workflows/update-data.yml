name: Update TruckersMP data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch TruckersMP API
        run: |
          mkdir -p data
          curl -sS --fail --max-time 30 "https://api.truckersmp.com/v2/servers" -o data/servers.json
          curl -sS --fail --max-time 30 "https://api.truckersmp.com/v2/game_time" -o data/game_time.json
          curl -sS --fail --max-time 30 "https://api.truckersmp.com/v2/events" -o data/events.json
          echo "Fetched at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > data/last_update.txt

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update TruckersMP live data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
